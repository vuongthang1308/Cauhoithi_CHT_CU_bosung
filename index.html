<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Ôn thi trắc nghiệm</title>
<style>
  :root{
    --bg:#0f1418; --card:#171f26; --card2:#1e2830;
    --text:#eef2f5; --sub:#8a99a6; --accent:#4fb0ff; --accent2:#2f7fd0;
    --good:#3ecf8e; --bad:#ff5c6c; --line:#28333c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;}
  #app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
  header{padding:16px 18px 10px;position:sticky;top:0;background:var(--bg);z-index:5;
    border-bottom:1px solid var(--line);}
  header h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.2px;}
  header .row{display:flex;align-items:center;justify-content:space-between;}
  .btn-icon{background:none;border:none;color:var(--sub);font-size:20px;padding:4px 8px;cursor:pointer;}
  main{flex:1;padding:14px 16px 90px;}

  .cat-card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;
    cursor:pointer;transition:background .15s;}
  .cat-card:active{background:var(--card2);}
  .cat-card .name{font-size:15px;font-weight:600;}
  .cat-card .meta{font-size:12.5px;color:var(--sub);margin-top:3px;}
  .cat-card .pct{font-size:13px;font-weight:700;color:var(--accent);min-width:44px;text-align:right;}
  .cat-card input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);margin-right:12px;}
  .cat-left{display:flex;align-items:center;flex:1;}

  .section-label{font-size:12px;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;
    margin:18px 0 8px 2px;font-weight:600;}

  .mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px;}
  .mode-btn{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;
    text-align:center;cursor:pointer;}
  .mode-btn .n{font-size:20px;font-weight:700;color:var(--accent);}
  .mode-btn .l{font-size:12.5px;color:var(--sub);margin-top:2px;}

  .primary-btn{display:block;width:100%;background:var(--accent);color:#04121e;border:none;
    border-radius:14px;padding:15px;font-size:16px;font-weight:700;margin-top:16px;cursor:pointer;}
  .primary-btn:disabled{opacity:.4;}
  .secondary-btn{display:block;width:100%;background:var(--card);color:var(--text);
    border:1px solid var(--line);border-radius:14px;padding:13px;font-size:14.5px;font-weight:600;
    margin-top:10px;cursor:pointer;}

  .progress-wrap{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .progress-bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .25s;}
  .progress-text{font-size:12.5px;color:var(--sub);white-space:nowrap;}

  .q-cat{font-size:12px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.4px;}
  .q-text{font-size:16.5px;line-height:1.5;margin:8px 0 18px;font-weight:600;}

  .opt{background:var(--card);border:1.5px solid var(--line);border-radius:13px;padding:13px 14px;
    margin-bottom:10px;font-size:14.5px;line-height:1.45;cursor:pointer;display:flex;gap:10px;}
  .opt .idx{font-weight:700;color:var(--sub);flex-shrink:0;}
  .opt.correct{border-color:var(--good);background:rgba(62,207,142,.12);}
  .opt.wrong{border-color:var(--bad);background:rgba(255,92,108,.12);}
  .opt.disabled{cursor:default;}

  .feedback{font-size:13.5px;color:var(--sub);margin:6px 0 4px;min-height:18px;}
  .feedback.good{color:var(--good);font-weight:600;}
  .feedback.bad{color:var(--bad);font-weight:600;}

  footer.quizfoot{position:sticky;bottom:0;background:var(--bg);padding:12px 16px 18px;
    border-top:1px solid var(--line);}

  .result-score{text-align:center;padding:24px 0 6px;}
  .result-score .big{font-size:44px;font-weight:800;color:var(--accent);}
  .result-score .sub{color:var(--sub);font-size:14px;margin-top:4px;}
  .wrong-item{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 14px;margin-bottom:10px;}
  .wrong-item .qq{font-size:14px;font-weight:600;margin-bottom:8px;}
  .wrong-item .a{font-size:13px;margin-bottom:4px;line-height:1.4;}
  .wrong-item .a.you{color:var(--bad);}
  .wrong-item .a.right{color:var(--good);}

  .hidden{display:none !important;}
  ::-webkit-scrollbar{width:0;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="row">
      <button class="btn-icon" id="backBtn" style="visibility:hidden;">‹ Quay lại</button>
      <h1 id="headerTitle">Ôn thi trắc nghiệm</h1>
      <span style="width:60px"></span>
    </div>
  </header>
  <main id="main"></main>
</div>

n-Kỹ thuật như thế nào?","options":["Người chỉ huy phái ra phân đội canh phòng phải trực tiếp chịu trách nhiệm về việc xảy ra các vi phạm của phân đội canh phòng.","Người chỉ huy phái ra phân đội canh phòng phải chịu trách nhiệm chính về việc xảy ra các vi phạm của phân đội canh phòng.","Người chỉ huy phái ra phân đội canh phòng phải chịu trách nhiệm về mọi mặt khi xảy ra các vi phạm của phân đội canh phòng."],"correct":0},{"category":"Tham mưu","question":"Đồng chí cho biết phân cấp kiểm tra của chỉ huy cấp cục và tương đương, nhà trường, nhà máy, xí nghiệp, bệnh viện, viện, kho, xưởng, lữ đoàn, trung đoàn, đoàn, trung tâm quy định trong Văn bản số 2130/HCKT-TM ngày 16/4/2025 của Tổng cục Hậu cần-Kỹ thuật như thế nào?","options":["Chỉ huy cấp cục và tương đương trực tiếp kiểm tra ít nhất 02-03 lần/tháng đối với các đầu mối cơ quan, đơn vị thuộc quyền. Chỉ huy cấp nhà trường, nhà máy, xí nghiệp, bệnh viện, viện, kho, xưởng, lữ đoàn, trung đoàn, đoàn, trung tâm kiểm tra 01 lần/tuần đối với các vọng gác thuộc quyền và chỉ đạo cơ quan chức năng kiểm tra ít nhất 01 lần/ngày đối với các đầu mối cơ quan, đơn vị thuộc quyền.","Chỉ huy cấp cục và tương đương trực tiếp kiểm tra ít nhất 01-02 lần/tháng đối với các đầu mối cơ quan, đơn vị thuộc quyền. Chỉ huy cấp nhà trường, nhà máy, xí nghiệp, bệnh viện, viện, kho, xưởng, lữ đoàn, trung đoàn, đoàn, trung tâm kiểm tra 01 lần/tuần đối với các vọng gác thuộc quyền và chỉ đạo cơ quan chức năng kiểm tra ít nhất 01 lần/ngày đối với các đầu mối cơ quan, đơn vị thuộc quyền.","Chỉ huy cấp cục và tương đương trực tiếp kiểm tra ít nhất 02-03 lần/tháng đối với các đầu mối cơ quan, đơn vị thuộc quyền. Chỉ huy cấp nhà trường, nhà máy, xí nghiệp, bệnh viện, viện, kho, xưởng, lữ đoàn, trung đoàn, đoàn, trung tâm kiểm tra 01 lần/tuần đối với các vọng gác thuộc quyền và chỉ đạo cơ quan chức năng kiểm tra ít nhất 02 lần/ngày đối với các đầu mối cơ quan, đơn vị thuộc quyền."],"correct":0},{"category":"Tham mưu","question":"Đồng chí cho biết phân :"Theo Thông tư số 107/2024/TT-BQP ngày 30/11/2024 của Bộ trưởng BQP quy định về nội dung gì?","options":["Quản lý và bảo đảm an toàn thông tin, an ninh mạng trong BQP.","Quản lý và bảo đảm an toàn thông tin phần mềm, cơ sở dữ liệu trong BQP.","Quản lý và bảo đảm an toàn thông tin, an ninh mạng máy tính trong BQP.","Quản lý và bảo đảm an toàn thông tin, an ninh mạng thuộc phạm vi quản lý của BQP"],"correct":3},{"category":"Chuyển đổi số, CNTT, ATTT","question":"Theo Thông tư số 107/2024/TT-BQP ngày 30/11/2024 của Bộ trưởng BQP quy định giải pháp khi sao chép dữ liệu điện tử quân sự giữa máy tính kết nối mạng máy tính quân sự với các loại máy tính khác là?","options":["Sử dụng vật mang dữ liệu điện tử có cài đặt giải pháp bảo đảm an toàn thông tin do Bộ Tư lệnh 86 cung cấp, hướng dẫn.","Sử dụng USB bảo mật do Cục Cơ yếu/BTTM cấp phát.","Sử dụng đĩa CD, DVD (dùng một lần và hủy).","Tất cả đáp án."],"correct":3},{"category":"Chuyển đổi số, CNTT, ATTT","question":"Theo Thông tư số 107/2024/TT-BQP ngày 30/11/2024 của Bộ trưởng BQP quy định các biện pháp khi có dấu hiệu mất an toàn thông tin, an ninh mạng, cơ quan quản lý công nghệ thông tin cần triển khai là?","options":["Sử dụng các biện pháp công nghệ, kỹ thuật để xác định nguyên nhân mất an toàn thông tin, an ninh mạng.","Cung cấp kết quả xác định nguyên nhân mất an toàn thông tin, an ninh mạng cho cơ quan chức năng thuộc BQP khi có yêu cầu.","Tiếp nhận các trang, thiết bị kỹ thuật và sử dụng các biện pháp công nghệ, kỹ thuật để khôi phục thông tin và hỗ trợ điều tra, xác minh chứng cứ theo yêu cầu của cơ quan điều tra.","Tất cả đáp án."],"correct":3},{"category":"Chuyển đổi số, CNTT, ATTT","question":"Theo Thông tư số 107/2024/TT-BQP ngày 30/11/2024 của Bộ trưởng BQP quy định thời gian thẩm định hồ sơ đề xuất cấp độ và phương án bảo đảm an toàn thông tin đối với hệ thống thông tin được đề xuất cấp độ 3 là?","options":["7 ngày","10 ngày","15 ngày","20 ngày"],"correct":1},{"category":"Điều lệnh quản lý bộ đội","questio thuộc trung ương và tương đương; chủ nhiệm kho quân khí cấp chiến lược, chiến dịch có quyền quyết định quy định như thế nào?","options":["Hạ từ cấp 1, cấp 2, cấp 3 xuống cấp 4; Nâng từ cấp 4 lên cấp 2, cấp 3.","Hạ từ cấp 1 xuống cấp 2, cấp 3; Hạ từ cấp 2 xuống cấp 3 và nâng từ cấp 3 lên cấp 2.","Hạ từ cấp 1, cấp 2 xuống cấp 4; Hạ từ cấp 4 xuống cấp 5."],"correct":1},{"category":"Hậu cần - Kỹ thuật","question":"Đồng chí cho biết quy định quản lý chìa khóa tủ súng đối với lực lượng Vệ binh, Bảo vệ được quy định như thế nào?","options":["Chỉ huy Đội (hoặc phân đội khi đóng quân độc lập) quản lý chìa khóa tủ súng phía trên (chìa khóa có số 1, 3), chìa khóa vòng cò (chìa khóa có số 5); người đốc gác quản lý chìa khóa tủ súng phía dưới (chìa khóa có số 2, 4) và chìa khóa hộp súng ngắn (chìa khóa có số 6).","Chỉ huy Đội (hoặc phân đội khi đóng quân độc lập) quản lý chìa khóa tủ súng phía trên (chìa khóa có số 1, 3), chìa khóa vòng cò (chìa khóa có số 5) và chìa khóa hộp súng ngắn (chìa khóa có số 6); người đốc gác quản lý chìa khóa tủ súng phía dưới (chìa khóa có số 2, 4).","Chỉ huy Đội (hoặc phân đội khi đóng quân độc lập) quản lý chìa khóa tủ súng phía trên (chìa khóa có số 1, 3); người đốc gác quản lý chìa khóa tủ súng phía dưới (chìa khóa có số 2, 4), chìa khóa vòng cò (chìa khóa có số 5) và chìa khóa hộp súng ngắn (chìa khóa có số 6)."],"correct":1},{"category":"Hậu cần - Kỹ thuật","question":"Đồng chí cho biết quy định quản lý chìa khóa tủ súng đối với tủ súng tại nhà kho quân khí nội bộ được quy định như thế nào?","options":["Trực chỉ huy đơn vị quản lý chìa khóa tủ súng phía trên (chìa khóa có số 1, 3); thủ kho quân khí quản lý chìa khóa tủ súng phía dưới (chìa khóa có số 2, 4), chìa khóa chốt (dây) khóa vòng cò (chìa khóa có số 5) và chìa khóa của hộp súng ngắn (chìa khóa có số 6).","Trực chỉ huy đơn vị quản lý chìa khóa tủ súng phía trên (chìa khóa có số 1, 3), chìa khóa của hộp súng ngắn (chìa khóa có số 6); thủ kho quân khí quản lý chìa khóa tủ súng phía dưới (chìa khóa có số 2, 4), chìa khóa chốt (dây) khóa vòng cò (chìa khóa có số 5).","Trực chỉ huy đơn vị quản lý chìa khóa tủ súng phía trên (chìa khóa có số 1, 3), chìa khóa chốt (dây) khóa vòng cò (chìa khóa có số 5) và chìa khóa của hộp súng ngắn (chìa khóa có số 6); thủ kho quân khí quản lý chìa khóa tủ súng phía dưới (chìa khóa có số 2, 4)"],"correct":0},{"category":"Văn thư lưu trữ, bảo mật","question":"Đồng chí cho biết Quy định quản lý con dấu, thiết bị lưu khóa bí mật như nào là đúng theo Thông tư số 68/2023/TT-BQP ngày 25/9/2023 của Bộ trưởng Bộ Quốc phòng?","options":["Cấp trưởng, người đứng đầu cơ quan,\tđơn vị có trách nhiệm giao cho văn thư cơ quan quản lý, sử dụng con dấu, thiết bị lưu khóa bí mật của tổ chức, cá nhân theo quy định của pháp luật và Bộ Quốc phòng.","Cấp trưởng, người đứng đầu cơ quan, đơn vị có trách nhiệm giao cho văn thư cơ quan quản lý, sử dụng con dấu, thiết bị lưu khóa bí mật của cơ quan, đơn vị theo quy định của pháp luật và Bộ Quốc phòng.","Cấp trưởng, người đứng đầu cơ quan, đơn vị có trách nhiệm giao cho văn thư cơ quan quản lý, sử dụng con dấu, thiết bị lưu khóa bí mật của cơ quan, đơn vị và thiết bị lưu khóa bí mật của chỉ huy cơ quan, đơn vị theo quy định của pháp luật và Bộ Quốc phòng.","Cấp trưởng, người đứng đầu cơ quan, đơn vị có trách nhiệm giao cho chỉ huy văn phòng (hoặc phòng, ban tham mưu, hành chính nơi không có văn phòng) quản lý, sử dụng con dấu, thiết bị lưu khóa bí mật của cơ quan, đơn vị theo quy định của pháp luật và Bộ Quốc phòng."],"correct":1},{"category":"Văn thư lưu trữ, bảo mật","question":"Thực hiện Thông tư số 68/2023/TT-BQP ngày 25/9/2023 của Bộ trưởng Bộ Quốc phòng, đồng chí hay cho biết trách nhiệm nào sau đây của cấp trưởng, người đứng đầu cơ quan, đơn vị trong việc lập hồ sơ và nộp lưu hồ sơ, tài liệu vào Lưu trữ cơ quan?","options":["Kiểm tra, hướng dẫn việc lập hồ sơ và giao nộp hồ sơ, tài liệu vào Lưu trữ cơ quan thuộc phạm vi quản lý.","Kiểm tra, hướng dẫn việc lập hồ sơ đối với cán bộ, nhân viên.","Chỉ đạo giao nộp hồ sơ vào lưu trữ các cấp khi cấp trên yêu cầu.","Chỉ đạo giao nộp tài liệu đã giải quyết xong vào lưu trữ."],"correct":0},{"category":"Văn thư lưu trữ, bảo mật","question":"Theo quy định tại Thông tư số 68/2023/TT-BQP ngày 25/9/2023 của Bộ trưởng Bộ Quốc phòng, đồng chí hay cho biết thẩm quyền sao văn bản thuộc về ai?","options":["Cấp trưởng, người đứng đầu cơ quan, đơn vị quyết định sao văn bản hoặc giao cho cấp trưởng, người đứng đầu cơ quan, đơn vị trực tiếp quản lý văn thư thực hiện sao văn bản (bao gồm tất cả văn bản đi và văn bản đến) theo quy định tại theo quy định tại Quy chế công tác văn thư trong Bộ Quốc phòng.","Cấp trưởng, người đứng đầu cơ quan, đơn vị quyết định việc sao văn bản hoặc giao cho cấp trưởng, người đứng đầu cơ quan, đơn vị cấp dưới thuộc quyền thực hiện sao văn bản (bao gồm tất cả văn bản đi và văn bản đến) theo quy định tại Quy chế công tác văn thư trong Bộ Quốc phòng.","Cấp trưởng, người đứng đầu cơ quan, đơn vị quyết định việc sao văn bản hoặc ủy quyền cho, người đứng đầu cơ quan, đơn vị cấp dưới thuộc quyền thực hiện sao văn bản (bao gồm tất cả văn bản đi và văn bản đến) theo quy định tại Quy chế công tác văn thư trong Bộ Quốc phòng.","Cấp trưởng, người đứng đầu cơ quan, đơn vị quyết định giao quyền cho cấp trưởng, người đứng đầu cơ quan, đơn vị trực tiếp quản lý văn thư thực hiện sao văn bản (bao gồm tất cả văn bản đi và văn bản đến) theo quy định tại Quy chế công tác văn thư trong Bộ Quốc phòng."],"correct":0},{"category":"Văn thư lưu trữ, bảo mật","question":"Đồng chí hay cho biết chế độ kiểm tra công tác kiểm tra nghiệp vụ công tác văn thư như nào là đúng theo quy định tại Thông tư số 68/2023/TT-BQP ngày 25/9/2023 của Bộ trưởng Bộ Quốc phòng?","options":["Định kỳ hoặc đột xuất cấp trưởng, người đứng đầu các cơ quan, đơn vị tổ chức kiểm tra, hướng dẫn việc thực hiện các chế độ, quy định về nghiệp vụ công tác văn thư của cơ quan, đơn vị trực thuộc và báo cáo kết quả kiểm tra với thủ trưởng cơ quan, đơn vị cấp trên theo quy định.","Định kỳ hoặc đột xuất cấp trưởng, người đứng đầu các cơ quan, đơn vị phối hợp với cơ quan nghiệp vụ cấp trên để tổ chức kiểm tra, hướng dẫn việc thực hiện các chế độ, quy định về nghiệp vụ công tác văn thư của cơ quan, đơn vị trực thuộc và báo cáo kết quả kiểm tra với thủ trưởng cơ quan, đơn vị cấp trên theo quy định.","Cấp trưởng, người đứng đầu các cơ quan, đơn vị trực thuộc Bộ Quốc phòng (hoặc ủy quyền cho cấp trưởng, người đứng đầu cơ quan, đơn vị trực tiếp quản lý văn thư) tổ chức kiểm tra, hướng dẫn việc thực hiện các chế độ, quy định về nghiệp vụ công tác văn thư của cơ quan, đơn vị trực thuộc.","Định kỳ hằng năm hoặc 06 tháng, cơ quan nghiệp vụ cấp trên có trách nhiệm kiểm tra công tác văn thư đối với các cơ quan, đơn vị cấp dưới, tổng hợp kết quả báo cáo với thủ trưởng, cơ quan, đơn vị trực tiếp quản lý."],"correct":2},{"category":"Văn thư lưu trữ, bảo mật","question":"Đồng chí hay cho biết theo quy định tại Thông tư số 125/2021/TT- BQP ngày 21/9/2021 của Bộ trưởng Bộ Quốc phòng, cơ quan, đơn vị sử dụng con dấu có hình Quân hiệu được quy định như thế nào?","options":["Cấp trung đoàn và tương đương trở lên; cơ quan, đơn vị được sử dụng con dấu theo quy định của pháp luật.","Trung đoàn và cơ quan, đơn vị tương đương trở lên, không hoạt động độc lập, không có tư cách pháp nhân, không có tài khoản riêng; cơ quan, đơn vị được sử dụng con dấu theo quy định của pháp luật.","Trung đoàn, ban chỉ huy quân sự huyện, quận trở lên, hoạt động độc lập, có tư cách pháp nhân, có tài khoản riêng; cơ quan, đơn vị được sử dụng con dấu theo quy định của pháp luật.","Cấp trung đoàn và cơ quan, đơn vị có cơ cấu tổ chức tương đương trung đoàn trở lên, hoạt động độc lập, có tư cách pháp nhân, có tài khoản riêng; cơ quan, đơn vị được sử dụng con dấu theo quy định của pháp luật."],"correct":3},{"category":"Văn thư lưu trữ, bảo mật","question":"Đồng chí hay cho biết theo quy định số 2110/QĐ-QUTW ngày 04/7/2023 của Quân ủy Trung ương quy định về việc chữ ký của người có thẩm quyền thực hiện như nào?","options":["Văn bản phải được cơ quan chủ trì soạn thảo ký đảm bảo cả về nội dung và thể thức trước khi trình lên bí thư đảng ủy ký ban hành.","Văn bản phải được cơ quan chính trị chủ trì soạn thảo ký đảm bảo về nội dung của văn bản trước khi trình lên bí thư đảng ủy ký ban hành.","Văn bản phải được cơ quan chính trị chủ trì soạn thảo ký đảm bảo về thể thức của văn bản trước khi trình lên bí thư đảng ủy ký ban hành.","Chữ ký thể hiện trách nhiệm và thẩm quyền của người ký đối với văn bản của cấp ủy, cơ quan, tổ chức đảng; không ký nháy, ký tắt vào văn bản ban hành chính thức."],"correct":3},{"category":"Văn thư lưu trữ, bảo mật","question":"Đồng chí cho biết bảo vệ bí mật nhà nước là trách nhiệm của ai?","options":["Là trách nhiệm của cơ quan, tổ chức, cá nhân có liên quan.","Là trách nhiệm của người làm công tác cơ yếu.","Là trách nhiệm của mọi tổ chức, cá nhân liên quan đến bí mật nhà nước.","Là trách nhiệm của Bộ Công an và Bộ Quốc phòng."],"correct":0},{"category":"Văn thư lưu trữ, bảo mật","question":"Đồng chí hay cho biết thẩm quyền quyết định điều chỉnh độ mật của bí mật nhà nước?","options":["Người có thẩm quyền xác định độ mật của bí mật nhà nước.","Người quyết định ban hành danh mục bí mật nhà nước.","Thủ trưởng cơ quan, đơn vị có Kho lưu trữ chuyên dụng.","Thủ trưởng cơ quan, đơn vị quản lý tài liệu, vật chứa bí mật nhà nước."],"correct":0},{"category":"Văn thư lưu trữ, bảo mật","question":"Đồng chí hay cho biết người đứng đầu cơ quan, tổ chức trực tiếp quản lý bí mật nhà nước có trách nhiệm nào sau đây?","options":["Đôn đốc việc thực hiện quy định của pháp luật về bảo vệ bí mật nhà nước trong cơ quan, tổ chức thuộc phạm vi quản lý.","Chỉ đạo, kiểm tra, đôn đốc việc thực hiện quy định của pháp luật và quy chế về bảo vệ bí mật nhà nước trong cơ quan, tổ chức thuộc phạm vi quản lý.","Chỉ đạo thực hiện quy chế, nội quy về bảo vệ bí mật nhà nước trong cơ quan, tổ chức thuộc phạm vi quản lý.","Chỉ đạo, kiểm tra, đôn đốc việc thực hiện nội quy về bảo vệ bí mật nhà nước trong cơ quan, tổ chức thuộc phạm vi quản lý."],"correct":1},{"category":"Văn thư lưu trữ, bảo mật","question":"Đồng chí hay cho biết nội dung nào sau đây thuộc độ “Tuyệt mật”?","options":["Các văn bản chỉ đạo của Quân ủy Trung ương, Bộ Quốc phòng về vũ khí, trang thiết bị phục vụ cho nhiệm vụ huấn luyện, sẵn sàng chiến đấu.","Tổng hợp, báo cáo số liệu tuyệt đối vũ khí, trang thiết bị thuộc Bộ Tổng Tham mưu, Tổng cục Chính trị, quân khu, quân chủng, quân đoàn.","Các loại vũ khí, phương tiện có ý nghĩa quyết định khả năng tác chiến phòng thủ đất nước.","Báo cáo tổng kiểm kê vũ khí, trang thiết bị thuộc Bộ Tổng Tham mưu, Tổng cục Chính trị, các tổng cục, quân khu, quân chủng, quân đoàn."],"correct":2},{"category":"Văn thư lưu trữ, bảo mật","question":"Cấp nào sau đây có thẩm quyền sao, chụp tài liệu, vật chứa bí mật nhà nước độ “Tuyệt mật”?","options":["Người đứng đầu cơ quan, đơn vị trực thuộc Bộ Quốc phòng, trừ doanh nghiệp trực thuộc Bộ Quốc phòng.","Người đứng đầu cơ quan, đơn vị trực thuộc Bộ Quốc phòng; trừ các vụ, viện, trung tâm, bệnh viện, doanh nghiệp trực thuộc Bộ Quốc phòng.","Người đứng đầu cơ quan, đơn vị trực thuộc Bộ Quốc phòng; trừ các học viện, nhà trường, doanh nghiệp trực thuộc Bộ Quốc phòng.","Người đứng đầu cơ quan, đơn vị trực thuộc Bộ Quốc phòng; trừ các vụ, viện, trung tâm, bệnh viện, học viện, nhà trường, doanh nghiệp trực thuộc Bộ Quốc phòng."],"correct":3},{"category":"Văn thư lưu trữ, bảo mật","question":"Đồng chí hay cho biết cấp nào sau đây có thẩm quyền sao, chụp tài liệu, vật chứa bí mật nhà nước độ “Tối mật”?","options":["Người đứng đầu cơ quan, đơn vị trực thuộc Bộ Quốc phòng.","Người đứng đầu lữ đoàn, trung đoàn, ban chỉ huy quân sự cấp huyện và tương đương.","Chánh Thanh tra quốc phòng cấp tỉnh và tương đương, Viện trưởng Viện Kiểm sát quân sự khu vực, Chánh án Tòa án quân sự khu vực.","Người đứng đầu viện, trung tâm, bệnh viện, học viện, nhà trường, doanh nghiệp trực thuộc các cơ quan, đơn vị trực thuộc Bộ Quốc phòng."],"correct":3},{"category":"Văn thư lưu trữ, bảo mật","question":"Đồng chí hay cho biết người đứng đầu cơ quan, đơn vị ủy quyền cho cấp phó cho phép sao, chụp tài liệu, vật chứa bí mật nhà nước thực hiện như thế nào?","options":["Việc ủy quyền được thực hiện thường xuyên và phải được thể hiện bằng văn bản.","Việc ủy quyền được thực hiện theo từng trường hợp cụ thể và phải xác định rõ phạm vi, nội dung, thời hạn ủy quyền.","Việc ủy quyền được thực hiện thường xuyên hoặc theo từng trường hợp cụ thể và phải được thể hiện bằng văn bản.","Việc ủy quyền được thực hiện thường xuyên hoặc theo từng trường hợp cụ thể và phải được thể hiện bằng văn bản, xác định rõ phạm vi, nội dung, thời hạn ủy quyền."],"correct":3},{"category":"Văn thư lưu trữ, bảo mật","question":"Đồng chí hay cho biết Kế hoạch, chương trình, báo cáo của Ban Chỉ đạo 35 thuộc bí mật nhà nước độ nào?","options":["Tuyệt mật.","Tối mật.","Thường.","Mật."],"correct":3},{"category":"Văn thư lưu trữ, bảo mật","question":"Thời hạn bảo vệ bí mật nhà nước độ “Tuyệt mật” là bao nhiêu năm?","options":["10 năm.","20 năm.","30 năm.","40 năm."],"correct":2},{"category":"Văn thư lưu trữ, bảo mật","question":"Đồng chí hay cho biết thẩm quyền cho phép sử dụng tài liệu lưu trữ đang bảo quản tại kho lưu trữ thuộc phạm vi quản lý được quy định như thế nào?","options":["Cấp trưởng, người đứng đầu cơ quan, đơn vị trực tiếp quản lý tài liệu kho lưu trữ quyết định việc sử dụng tài liệu lưu trữ.","Cấp trưởng, người đứng đầu cơ quan, đơn vị quyết định việc sử dụng tài liệu lưu trữ đang bảo quản tại kho lưu trữ thuộc phạm vi quản lý hoặc có thể ủy quyền cho thủ trưởng cơ quan trực tiếp quản lý kho lưu trữ quyết định việc sử dụng tài liệu.","Việc sử dụng tài liệu lưu trữ khi được sự cho phép của chỉ huy cơ quan, đơn vị chủ trì soạn thảo văn bản có tài liệu tại kho lưu trữ và ý kiến đồng ý của người chỉ huy quản lý trực tiếp kho lưu trữ quyết định.","Việc sử dụng tài liệu lưu trữ khi được sự cho phép của người đứng đầu kho lưu trữ lịch sử cơ quan Bộ Quốc phòng và cấp trưởng, người đứng đầu cơ quan, đơn vị quản lý tài liệu kho lưu trữ."],"correct":1},{"category":"Văn thư lưu trữ, bảo mật","question":"Đồng chí hay cho biết thẩm quyền cho phép mang tài liệu ra ngoài kho lưu trữ để sử dụng ở nước ngoài được quy định như thế nào?","options":["Thủ tướng Chính phủ, Bộ trưởng Bộ Quốc phòng quyết định cho phép mang tài liệu lưu trữ của các cơ quan, đơn vị trong Bộ Quốc phòng ra ngoài kho lưu trữ để phục vụ công tác nước ngoài.","Thủ trưởng Bộ Tổng Tham mưu, Thủ trưởng Tổng cục Chính trị quyết định cho phép mang tài liệu lưu trữ của các cơ quan, đơn vị trong Bộ Quốc phòng ra ngoài kho lưu trữ để phục vụ công tác nước ngoài.","Thủ trưởng các cơ quan đơn vị trực thuộc Bộ Quốc phòng quyết định cho phép mang tài liệu lưu trữ của các cơ quan, đơn vị trong Bộ Quốc phòng ra ngoài kho lưu trữ để phục vụ công tác nước ngoài khi có văn bản thẩm định của Cục Bảo vệ an ninh Quân đội.","Bộ trưởng Bộ Quốc phòng quyết định cho phép mang tài liệu lưu trữ của các cơ quan, đơn vị trong Bộ Quốc phòng ra ngoài kho lưu trữ để phục vụ công tác nước ngoài."],"correct":3},{"category":"Văn thư lưu trữ, bảo mật","question":"Đồng chí hay cho biết khi có cán bộ mang tài liệu lưu trữ ra ngoài kho để mang đi công tác nước ngoài phải làm những thủ tục nào?","options":["Cơ quan, đơn vị có cán bộ đi công tác phải báo cáo thủ trưởng cơ quan, đơn vị trực thuộc B ộ Quốc phòng và văn bản thẩm định của cơ quan bảo vệ an ninh.","Cơ quan, đơn vị trực thuộc Bộ Quốc phòng có văn bản đề nghị Văn phòng Bộ Quốc phòng và văn bản thẩm định của Cục Bảo vệ an ninh Quân đội.","Cơ quan, đơn vị trực thuộc Bộ Quốc phòng có văn bản xin phép Bộ trưởng Bộ Quốc phòng, văn bản thẩm định của Cục Bảo vệ an ninh Quân đội.","Cơ quan, đơn vị trực thuộc Bộ Quốc phòng có văn bản đề nghị Văn phòng Bộ Quốc phòng, Bộ Tổng Tham mưu và văn bản thẩm định của Cục Bảo vệ an ninh Quân đội."],"correct":2},{"category":"Văn thư lưu trữ, bảo mật","question":"Đồng chí hay cho biết trong thời gian công tác, nếu phát hiện tài liệu lưu trữ bị lộ, bị mất, bị hỏng, người mang tài liệu lưu trữ phải làm gì?","options":["Phải báo cáo ngay với trưởng đoàn công tác để có biện pháp xử lý và khắc phục hậu quả.","Phải báo cáo ngay với thủ trưởng cơ quan, đơn vị trực tiếp quản lý để có biện pháp xử lý và khắc phục hậu quả.","Phải báo cáo ngay với thủ trưởng cơ quan, đơn vị trực tiếp quản lý, trưởng đoàn công tác để có biện pháp xử lý và khắc phục hậu quả.","Phải phối hợp ngay với cơ quan bảo vệ an ninh và kho lưu trữ nơi quản lý tài liệu để có biện pháp xử lý và khắc phục hậu quả."],"correct":2},{"category":"Văn thư lưu trữ, bảo mật","question":"Đồng chí hay cho biết thẩm quyền cho phép mang tài liệu, vật chứa bí mật nhà nước ra khỏi nơi lưu giữ để phục vụ công tác trong nước?","options":["Thủ trưởng cơ quan, đơn vị có cán bộ đi công tác.","Quyết định của cấp có thẩm quyền cho phép.","Người trực tiếp quản lý bí mật nhà nước đồng ý.","Người đứng đầu cơ quan, đơn vị trực tiếp quản lý bí mật nhà nước."],"correct":3},{"category":"Đối ngoại quốc phòng","question":"Đồng chí cho biết vai trò về công tác hợp tác quốc tế và đối ngoại quân sự của Tổng cục là gì?","options":["Thực hiện nhiệm vụ hợp tác quốc tế và phối hợp thực hiện công tác đối ngoại quân sự theo chỉ đạo của Quân ủy Trung ương và Bộ Quốc phòng.","Chỉ thực hiện công tác lễ tân.","Chỉ tổ chức đoàn ra.","Chỉ quản lý học viên quốc tế."],"correct":0},{"category":"Đối ngoại quốc phòng","question":"Đồng chí cho biết Đoàn do Bộ trưởng Bộ Quốc phòng chủ trì thăm nước ngoài được gọi là gì?","options":["Đoàn B","Đoàn C","Đoàn A","Đoàn đặc biệt"],"correct":2},{"category":"Đối ngoại quốc phòng","question":"Đồng chí cho biết sau khi tổ chức thực hiện thăm chính thức, thăm làm việc, cơ quan, đơn vị chủ quản phải báo cáo kết quả công tác nước ngoài trong thời hạn bao nhiêu ngày?","options":["03 ngày.","05 ngày.","07 ngày.","10 ngày."],"correct":0},{"category":"Đối ngoại quốc phòng","question":"Đồng chí cho biết cơ quan, đơn vị có nhu cầu đón chuyên gia, người nước ngoài vào làm việc phải có công văn báo cáo chỉ huy Tổng cục trước bao nhiêu ngày?","options":["03 ngày.","05 ngày.","07 ngày.","10 ngày."],"correct":3},{"category":"Đối ngoại quốc phòng","question":"Đồng chí cho biết bản cam kết giữ bí mật nhà nước, bí mật quân sự khi đi nước ngoài phải do ai ký duyệt?","options":["Trưởng đoàn.","Cục Đối ngoại.","Thủ trưởng cơ quan, đơn vị chủ quản trực thuộc BQP.","Văn phòng Bộ Quốc phòng."],"correct":2}];
</script>
<script>
let STATS = {};
let selectedCats = new Set();
let session = null;

function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

async function loadStats(){
  try{
    const raw = localStorage.getItem('quiz-stats-kt');
    STATS = raw ? JSON.parse(raw) : {};
  }catch(e){ STATS = {}; }
}
async function saveStats(){
  try{ localStorage.setItem('quiz-stats-kt', JSON.stringify(STATS)); }catch(e){}
}
function bumpStat(cat, isCorrect){
  if(!STATS[cat]) STATS[cat]={seen:0,correct:0};
  STATS[cat].seen++;
  if(isCorrect) STATS[cat].correct++;
}

const main = document.getElementById('main');
const headerTitle = document.getElementById('headerTitle');
const backBtn = document.getElementById('backBtn');

function setHeader(title, showBack, backFn){
  headerTitle.textContent = title;
  backBtn.style.visibility = showBack ? 'visible':'hidden';
  backBtn.onclick = backFn || (()=>{});
}

function renderHome(){
  setHeader('Ôn thi trắc nghiệm', false);
  const cats = [...new Set(QUESTIONS.map(q=>q.category))];
  selectedCats = new Set(cats);
  main.innerHTML = '';

  const label = document.createElement('div');
  label.className='section-label';
  label.textContent='Chọn chuyên đề';
  main.appendChild(label);

  cats.forEach(cat=>{
    const total = QUESTIONS.filter(q=>q.category===cat).length;
    const st = STATS[cat];
    const pct = st && st.seen ? Math.round(100*st.correct/st.seen) : null;

    const card = document.createElement('div');
    card.className='cat-card';
    card.innerHTML = `
      <div class="cat-left">
        <input type="checkbox" checked data-cat="${cat}">
        <div>
          <div class="name">${cat}</div>
          <div class="meta">${total} câu${st?` · đã làm ${st.seen}`:''}</div>
        </div>
      </div>
      <div class="pct">${pct!==null?pct+'%':''}</div>
    `;
    const cb = card.querySelector('input');
    cb.onchange = ()=>{
      if(cb.checked) selectedCats.add(cat); else selectedCats.delete(cat);
    };
    card.onclick = (e)=>{ if(e.target.tagName!=='INPUT'){ cb.checked=!cb.checked; cb.onchange(); } };
    main.appendChild(card);
  });

  const modeLabel = document.createElement('div');
  modeLabel.className='section-label';
  modeLabel.textContent='Số câu mỗi lượt';
  main.appendChild(modeLabel);

  const grid = document.createElement('div');
  grid.className='mode-grid';
  [10,20,50,0].forEach(n=>{
    const b = document.createElement('div');
    b.className='mode-btn';
    b.innerHTML = `<div class="n">${n===0?'Tất cả':n}</div><div class="l">câu</div>`;
    b.onclick = ()=>{ [...grid.children].forEach(c=>c.style.borderColor='var(--line)'); b.style.borderColor='var(--accent)'; grid.dataset.chosen=n; };
    grid.appendChild(b);
  });
  grid.dataset.chosen = 20;
  grid.children[1].style.borderColor='var(--accent)';
  main.appendChild(grid);

  const startBtn = document.createElement('button');
  startBtn.className='primary-btn';
  startBtn.textContent='Bắt đầu làm bài';
  startBtn.onclick = ()=> startQuiz(parseInt(grid.dataset.chosen));
  main.appendChild(startBtn);

  const resetBtn = document.createElement('button');
  resetBtn.className='secondary-btn';
  resetBtn.textContent='Xoá tiến độ đã lưu';
  resetBtn.onclick = async ()=>{
    if(confirm('Xoá toàn bộ thống kê đã lưu?')){
      STATS = {}; await saveStats(); renderHome();
    }
  };
  main.appendChild(resetBtn);
}

function startQuiz(count){
  let pool = QUESTIONS.filter(q=>selectedCats.has(q.category));
  if(pool.length===0){ alert('Hãy chọn ít nhất 1 chuyên đề.'); return; }
  pool = shuffle(pool);
  if(count>0) pool = pool.slice(0,count);
  session = {items:pool, idx:0, correctCount:0, wrongList:[]};
  renderQuestion();
}

function renderQuestion(){
  setHeader('Câu hỏi', true, renderHome);
  const {items, idx} = session;
  const q = items[idx];
  const optOrder = q._optOrder || (q._optOrder = shuffle(q.options.map((_,i)=>i)));

  main.innerHTML = '';

  const pw = document.createElement('div'); pw.className='progress-wrap';
  pw.innerHTML = `<div class="progress-bar"><div class="progress-fill" style="width:${100*idx/items.length}%"></div></div>
    <div class="progress-text">${idx+1}/${items.length}</div>`;
  main.appendChild(pw);

  const catEl = document.createElement('div'); catEl.className='q-cat'; catEl.textContent=q.category;
  main.appendChild(catEl);
  const qEl = document.createElement('div'); qEl.className='q-text'; qEl.textContent=q.question;
  main.appendChild(qEl);

  const fb = document.createElement('div'); fb.className='feedback'; fb.id='fb';
  const optsWrap = document.createElement('div');

  let answered = false;
  optOrder.forEach((origIdx, displayI)=>{
    const opt = document.createElement('div');
    opt.className='opt';
    opt.innerHTML = `<span class="idx">${String.fromCharCode(65+displayI)}.</span><span>${q.options[origIdx]}</span>`;
    opt.onclick = ()=>{
      if(answered) return;
      answered = true;
      const isCorrect = origIdx===q.correct;
      [...optsWrap.children].forEach((el,i)=>{
        el.classList.add('disabled');
        if(optOrder[i]===q.correct) el.classList.add('correct');
      });
      if(!isCorrect) opt.classList.add('wrong');
      fb.textContent = isCorrect ? '✓ Chính xác!' : '✗ Chưa đúng — đáp án đúng đã được tô xanh.';
      fb.className = 'feedback ' + (isCorrect?'good':'bad');
      bumpStat(q.category, isCorrect);
      saveStats();
      if(isCorrect) session.correctCount++;
      else session.wrongList.push({q, chosen:origIdx});
      nextBtn.disabled = false;
    };
    optsWrap.appendChild(opt);
  });
  main.appendChild(optsWrap);
  main.appendChild(fb);

  const spacer = document.createElement('div'); spacer.style.height='70px';
  main.appendChild(spacer);

  const foot = document.createElement('footer'); foot.className='quizfoot';
  const nextBtn = document.createElement('button');
  nextBtn.className='primary-btn'; nextBtn.style.marginTop='0';
  nextBtn.textContent = idx+1<items.length ? 'Câu tiếp theo' : 'Xem kết quả';
  nextBtn.disabled = true;
  nextBtn.onclick = ()=>{
    if(idx+1<items.length){ session.idx++; renderQuestion(); }
    else renderResult();
  };
  foot.appendChild(nextBtn);
  main.appendChild(foot);
}

function renderResult(){
  setHeader('Kết quả', true, renderHome);
  main.innerHTML = '';
  const {items, correctCount, wrongList} = session;
  const pct = Math.round(100*correctCount/items.length);

  const box = document.createElement('div'); box.className='result-score';
  box.innerHTML = `<div class="big">${correctCount}/${items.length}</div>
    <div class="sub">${pct}% chính xác</div>`;
  main.appendChild(box);

  const retryBtn = document.createElement('button');
  retryBtn.className='primary-btn';
  retryBtn.textContent = wrongList.length ? `Làm lại ${wrongList.length} câu sai` : 'Làm bài mới';
  retryBtn.onclick = ()=>{
    if(wrongList.length){
      session = {items: shuffle(wrongList.map(w=>w.q)), idx:0, correctCount:0, wrongList:[]};
      renderQuestion();
    } else renderHome();
  };
  main.appendChild(retryBtn);

  const homeBtn = document.createElement('button');
  homeBtn.className='secondary-btn';
  homeBtn.textContent='Về trang chủ';
  homeBtn.onclick = renderHome;
  main.appendChild(homeBtn);

  if(wrongList.length){
    const lbl = document.createElement('div'); lbl.className='section-label'; lbl.textContent='Xem lại câu sai';
    main.appendChild(lbl);
    wrongList.forEach(({q,chosen})=>{
      const w = document.createElement('div'); w.className='wrong-item';
      w.innerHTML = `<div class="qq">${q.question}</div>
        <div class="a you">Bạn chọn: ${q.options[chosen]}</div>
        <div class="a right">Đáp án đúng: ${q.options[q.correct]}</div>`;
      main.appendChild(w);
    });
  }
}

(async function init(){
  await loadStats();
  renderHome();
})();
</script>
</body>
</html>
